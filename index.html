function person(w){const baby=w.startsWith('baby'),elder=w.startsWith('grand')||w==='old',child=['sister','brother','young'].includes(w),female=['grandmother','mother','sister','baby sister','pretty'].includes(w);const hair=elder?'#acb3b5':'#4b4240';return svg(`<g transform="${baby?'translate(36 35) scale(.65)':child?'translate(18 16) scale(.82)':''}"><path d="M60 78Q100 58 140 78V135H60Z" fill="${female?'#cd91a0':'#7296b0'}"/><circle cx="100" cy="50" r="30" fill="#e9bfa1"/><path d="M69 45Q62 7 102 16Q140 11 132 46L112 32L85 43Z" fill="${hair}"/>${female?`<path d="M69 30Q50 55 65 85M132 30Q150 55 135 85" stroke="${hair}" stroke-width="12" fill="none"/>`:''}<circle cx="90" cy="50" r="3" fill="#364655"/><circle cx="110" cy="50" r="3" fill="#364655"/><path d="M90 63Q100 69 112 63" stroke="#9e6858" stroke-width="3" fill="none"/>${elder?'<path d="M72 48H94V59H72ZM106 48H128V59H106ZM94 52H106" stroke="#516374" stroke-width="2" fill="none"/>':''}${baby?'<circle cx="100" cy="67" r="6" fill="#d3a94c"/>':''}</g>`)}
const $=id=>document.getElementById(id),key='mua-wordlab-eight-v2';let all={},state,memoryOnly=false;try{all=JSON.parse(localStorage.getItem(key))||{}}catch(e){memoryOnly=true}
function fresh(){return {seen:[],passed:false,unlocked:false,attempts:0}}
function select(n){if(window.speechSynthesis)speechSynthesis.cancel();unit=n;data=units[n].words.map((x,i)=>({...x,id:i}));let saved=all[book==='go'?n:book+'-'+n];state=saved&&Array.isArray(saved.seen)?saved:fresh();state.seen=[...new Set(state.seen.filter(i=>Number.isInteger(i)&&i>=0&&i<data.length))];all[book==='go'?n:book+'-'+n]=state;home()}
function save(){all[book==='go'?unit:book+'-'+unit]=state;try{localStorage.setItem(key,JSON.stringify(all))}catch(e){memoryOnly=true}}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
let mode,questions=[],at=0,score=0,answers=[],locked=false,heard=false;function show(id){for(const n of ['home','quiz','result'])$(n).classList.toggle('hidden',n!==id)}
function home(){$('bookCaption').textContent=book==='go'?'LET’S GO 1 · FIFTH EDITION':book==='begin'?'LET’S BEGIN 1 · FIFTH EDITION':book==='begin2'?'LET’S BEGIN 2 · FIFTH EDITION':'LET’S GO 2 · FIFTH EDITION';$('bookDescription').textContent=book==='go'?'Let’s Go 1 · 全册八个单元':book==='begin'?'Let’s Begin 1 · 五组字母词汇':book==='begin2'?'Let’s Begin 2 · 全册八个单元':'Let’s Go 2 · 全册八个单元';$('goBook').classList.toggle('secondary',book!=='go');$('go2Book').classList.toggle('secondary',book!=='go2');$('beginBook').classList.toggle('secondary',book!=='begin');$('begin2Book').classList.toggle('secondary',book!=='begin2');if(window.speechSynthesis)speechSynthesis.cancel();show('home');$('count').textContent=state.seen.length+'/'+data.length;$('bar').style.width=state.seen.length/data.length*100+'%';$('status').textContent=state.passed?'🏅 已通关':state.unlocked?'✓ 可挑战':'学习中';$('challenge').disabled=!state.unlocked;$('challenge').textContent=state.unlocked?'开始通关挑战 · 8题 →':'🔒 完成16题后解锁';$('practice').textContent=state.seen.length?'再练一轮 · 16题':'开始练习 · 16题';$('unitTitle').textContent=(book==='begin'?'Group ':'Unit ')+(unit+1)+' · '+units[unit].zh;$('heroTitle').textContent=units[unit].title;$('badge').textContent='🐝 '+data.length+'个教材词';$('list').classList.add('hidden');$('unitNav').innerHTML=units.map((u,i)=>`<button class="unitBtn ${i===unit?'active':''}" data-unit="${i}"><small>${book==='begin'?'GROUP':'UNIT'} ${i+1} ${all[book==='go'?i:book+'-'+i]?.passed?'🏅':''}</small><strong>${u.zh}</strong><span>${u.title}</span></button>`).join('');document.querySelectorAll('.unitBtn').forEach(b=>b.onclick=()=>select(+b.dataset.unit));$('note').textContent=book==='go2'?'词汇与短语来自本单元核心词表。'+(data.length<16?'本单元不足16条，练习会重复复习。':'每轮16题，每条出现一次。')+'完成后解锁8题测试，8题全对通关。进度保存在当前浏览器。':book==='begin2'?'教材核心词与本单元拼读词分别标注。'+(data.length<16?'本单元少于16个词，日常练习会重复复习。':'每轮优先安排未练过的词。')+'完成16题解锁8题测试，8题全对通关。进度保存在当前浏览器。':book==='begin'?'按教材五组字母组织常用词汇；不含人物名字。'+(data.length<16?'本组词少于16个，练习会重复复习。':'每轮优先练习未练过的词。')+'完成16题后解锁8题测试。进度保存在当前浏览器。':(unit===3?'含14个核心词 + apple、cat 两个本单元拼读词。':unit===5?'含12个核心词 + igloo、bib、big、pit 四个本单元拼读词。':'单复数分别练习；只使用本单元教材词。')+' 每轮16题，完成后解锁8题挑战。'+(memoryOnly?'进度仅在本次打开期间有效。':'进度保存在当前浏览器。');}
function start(m){if(m==='test'&&!state.unlocked)return;mode=m;if(m==='practice'){let unseen=shuffle(data.filter(x=>!state.seen.includes(x.id))),seen=shuffle(data.filter(x=>state.seen.includes(x.id)));let chosen=[...unseen,...seen].slice(0,16);while(chosen.length<16)chosen.push(...shuffle(data).slice(0,16-chosen.length));questions=shuffle(chosen)}else questions=shuffle(data).slice(0,8);at=0;score=0;answers=[];show('quiz');render()}
function speak(){if(!window.speechSynthesis){$('toast').textContent='当前浏览器不支持发音，请用支持语音的浏览器打开。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(questions[at].word);u.lang='en-US';u.rate=.8;u.voice=speechSynthesis.getVoices().find(v=>v.lang==='en-US')||speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'))||null;u.onstart=()=>{$('toast').textContent='';heard=true;document.querySelectorAll('.card').forEach(b=>b.disabled=locked)};u.onerror=()=>{$('toast').textContent='发音未成功，请重听或切换浏览器。'};speechSynthesis.speak(u)}
function render(){locked=false;heard=false;$('listen').disabled=false;$('next').disabled=true;$('feedback').textContent='';$('toast').textContent='请先点击听单词，再选择图片';$('step').textContent=(book==='begin'?'Group ':'Unit ')+(unit+1)+' · '+(mode==='test'?'通关挑战':'日常练习')+' · '+(at+1)+'/'+questions.length;$('qbar').style.width=at/questions.length*100+'%';$('prompt').textContent=mode==='test'?'听一听，8题全对即可通关':'听单词，选择对应图片';const q=questions[at];let pool=data.filter(x=>x.id!==q.id);if((book==='go'&&unit===1)||(book==='begin2'&&unit===1)){let isColor=x=>Object.keys({yellow:1,blue:1,red:1,green:1,purple:1,orange:1,brown:1,pink:1,black:1,white:1}).includes(x.word);pool=pool.filter(x=>isColor(x)===isColor(q))}if(book==='go'&&unit===3){const family=['grandmother','grandfather','mother','father','sister','brother','baby sister','baby brother'];if(family.includes(q.word))pool=pool.filter(x=>family.includes(x.word));else if(['tall','short','young','old','pretty','handsome'].includes(q.word))pool=pool.filter(x=>['tall','short','young','old','pretty','handsome'].includes(x.word));}if(book==='begin2'&&unit===2){let shapeWords=['circle','square','triangle','heart','star','rectangle','diamond','oval'];pool=pool.filter(x=>shapeWords.includes(x.word)===shapeWords.includes(q.word));}const options=shuffle([q,...shuffle(pool).slice(0,3)]);$('options').innerHTML=options.map((o,i)=>`<button class="card" data-id="${o.id}" aria-label="选项${String.fromCharCode(65+i)}" disabled><span class="letter">${String.fromCharCode(65+i)}</span>${art(o.word)}</button>`).join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>answer(+b.dataset.id));$('next').textContent=at===questions.length-1?'查看结果 →':'下一题 →'}
function answer(id){if(locked||!heard)return;locked=true;const q=questions[at],ok=id===q.id;score+=ok?1:0;answers.push({q,ok});if(mode==='practice'){if(!state.seen.includes(q.id))state.seen.push(q.id);save()}document.querySelectorAll('.card').forEach(b=>{b.disabled=true;if(mode==='practice'){if(+b.dataset.id===q.id)b.classList.add('right');else if(+b.dataset.id===id)b.classList.add('wrong')}});$('feedback').textContent=mode==='test'?'答案已提交':(ok?'✓ 答对了！ ':'再记住这个词： ')+q.word+' · '+q.zh;$('next').disabled=false;}
function finish(){window.speechSynthesis?.cancel();if(mode==='practice'){state.unlocked=true;save()}const passed=mode==='test'&&score===8;if(mode==='test'){state.attempts++;if(passed)state.passed=true;save()}show('result');const wrong=answers.filter(x=>!x.ok);$('result').innerHTML=`<div style="font-size:52px">${passed?'🏅':mode==='test'?'🐝':'🌟'}</div><h1>${passed?'恭喜，'+(book==='begin'?'Group ':'Unit ')+(unit+1)+' 通关！':mode==='test'?'再挑战一次，你可以的！':'16题练习完成！'}</h1><h2>${score} / ${questions.length}</h2><p>${mode==='practice'?'已练习词汇 '+state.seen.length+'/'+data.length+' · 8题通关挑战已解锁':passed?'8题全部答对，继续保持！':'需要8题全部答对才能通关。先复习下面的词吧。'}</p>${wrong.length?'<p>本轮需要复习：'+wrong.map(x=>x.q.word+'（'+x.q.zh+'）').join('、')+'</p>':'<p>这一轮全部正确！</p>'}<div class="actions" style="justify-content:center"><button id="retry">${mode==='practice'?'开始8题挑战':'再次挑战'}</button><button class="secondary" id="return">返回单元</button>${passed&&unit<units.length-1?'<button class="secondary" id="nextUnit">下一个单元 →</button>':''}</div>`;$('retry').onclick=()=>start('test');$('return').onclick=home;if(passed&&unit<units.length-1)$('nextUnit').onclick=()=>select(unit+1);}
$('practice').onclick=()=>start('practice');$('challenge').onclick=()=>start('test');$('back').onclick=home;$('listen').onclick=speak;$('next').onclick=()=>{if(!locked)return;if(++at===questions.length)finish();else{window.speechSynthesis?.cancel();render()}};$('words').onclick=()=>{$('list').classList.toggle('hidden');$('list').innerHTML=data.map(x=>`<div class="word">${art(x.word)}<strong>${x.word}</strong><small>${x.zh}</small><em>${x.group}</em></div>`).join('')};function switchBook(b){book=b;units=b==='go'?goUnits:b==='begin'?beginUnits:b==='begin2'?begin2Units:go2Units;questions=[];select(0)}$('goBook').onclick=()=>switchBook('go');
$('go2Book').onclick=()=>switchBook('go2');

switchBook('go2');
